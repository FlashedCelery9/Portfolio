<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>

    <filter id="blotches">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="2" seed="12"/>
      <feDisplacementMap scale="40"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" filter="url(#noise)" />
  <rect width="100%" height="100%" filter="url(#blotches)" />
</svg>
